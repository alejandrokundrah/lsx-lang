name: LSX Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix ./vscode-extension install --no-audit --no-fund
          npm --prefix ./vscode-extension/server install --no-audit --no-fund

      - name: Run tests and compile checks
        run: npm run quality

      - name: Package VS Code extension
        working-directory: ./vscode-extension
        run: npx @vscode/vsce package --no-yarn

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsx-vsix
          path: ./vscode-extension/*.vsix

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ./vscode-extension/*.vsix

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix ./vscode-extension install --no-audit --no-fund
          npm --prefix ./vscode-extension/server install --no-audit --no-fund

      - name: Run tests and compile checks
        run: npm run quality

      - name: Verify the tag matches the package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'." >&2
            echo "Bump package.json, packages/lsx-core/package.json and the extension before tagging." >&2
            exit 1
          fi

      # Publish order matters: lsx-core first, then lsx-lang.
      - name: Publish lsx-core
        working-directory: ./packages/lsx-core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish lsx-lang
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
